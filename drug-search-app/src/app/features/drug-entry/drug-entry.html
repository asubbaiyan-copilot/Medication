<p>drug-entry works!</p>
<h1>{{title}}</h1>
  @for (d of getDrugList(); track $index; let i = $index) {
      <app-drug-card
        [name]="d.name"
        [dose]="d.dose"
        [price]="d.price"
        [quantity]="d.quantity"
        (quantityChange)="updateQuantity(i, $event)"
        (priceChange)="updatePrice(i, $event)">
    </app-drug-card>
    }
    <button (click)="raisePrice()">Raise Price</button>    
    <button (click)="updateDrug(0, { name: 'Updated Drug', dose: 150, price: 7, quantity: 0 })">Update First Drug</button>
    <button (click)="addDrug()">Add Drug</button>
    <button (click)="removeDrug()">Remove Drug</button>
    <p>Total drugs: {{getDrugList().length}}</p>
    @if(getDrugList().length === 0) {
      <p>No drugs available.</p>
    }
    @else {
      <p>Drugs are available.</p>
    }
